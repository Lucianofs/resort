*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{background:${x.bg0};color:${x.text};min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
input,select{background:${x.bg3};border:1px solid ${x.border};color:${x.text};padding:10px 12px;border-radius:8px;width:100%;font-size:16px;outline:none;font-family:inherit}
input:focus,select:focus{border-color:${x.gold}}
button{cursor:pointer;font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid ${x.gold};outline-offset:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.anim{animation:fadeIn .3s ease backwards}
.spin svg{animation:spin .8s linear infinite}
.shell{display:flex;height:100vh;height:100dvh;overflow:hidden;background:${x.bg0}}
.side{width:236px;background:${x.bg1};border-right:1px solid ${x.border};padding:18px 14px;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.main{flex:1;overflow-y:auto;min-width:0}
.page{padding:28px;max-width:1280px;margin:0 auto}
.top{display:none;align-items:center;gap:12px;padding:10px 16px;background:${x.bg1};border-bottom:1px solid ${x.border};position:sticky;top:0;z-index:20}
.scrim{display:none}
.nav{display:grid;gap:4px;margin:18px 0}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:${x.muted};font-size:14px;text-align:left}
.nav button:hover{background:${x.bg3};color:${x.text}}
.nav button[aria-current=page]{background:${x.goldD};color:${x.gold};font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin-bottom:22px}
.kpi{padding:18px 20px}
.kpi-v{font-size:clamp(20px,5.2vw,26px);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.card{padding:20px 22px}
.h-title{font-size:clamp(20px,5.5vw,26px);font-weight:600}
.paper{background:#fff;color:#111;border-radius:10px;padding:28px 30px}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;margin-bottom:22px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:${x.muted};margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{text-align:left;color:${x.muted};font-weight:500;font-size:12px;padding:8px 12px;border-bottom:1px solid ${x.borderL};white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid ${x.border};white-space:nowrap}
tr.me td{background:${x.goldD}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:9px;border:1px solid ${x.border};background:${x.bg3};color:${x.text};font-size:13px;font-weight:600}
.btn:hover{border-color:${x.borderL}}
.btn.gold{background:${x.gold};color:${x.bg0};border-color:${x.gold}}
.btn.danger{color:${x.danger}}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{padding:7px 14px;border-radius:20px;border:1px solid ${x.border};background:transparent;color:${x.muted};font-size:13px}
.tabs button[aria-pressed=true]{background:${x.goldD};color:${x.gold};border-color:${x.gold}55}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;padding:16px;z-index:100;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.modal{background:${x.card};border:1px solid ${x.borderL};border-radius:14px;width:100%;max-width:600px;margin:auto;padding:22px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;margin-bottom:12px}
.fg label{font-size:12px;color:${x.muted};display:block;margin-bottom:5px}
.legend{align-items:center}
.grid-t input,.grid-t select{padding:6px 8px;font-size:14px;min-width:90px;border-radius:6px}
.grid-t td{padding:5px 6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:${x.card2};border:1px solid ${x.borderL};padding:10px 16px;border-radius:10px;z-index:80;font-size:13px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.note{font-size:12px;color:${x.muted};line-height:1.6}
@media (max-width:820px){
  .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-105%);transition:transform .2s;z-index:40;width:260px}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30}
  .top{display:flex}
  .page{padding:14px 14px 28px}
  .card{padding:16px}
  .kpi{padding:14px}
  .paper{padding:18px 16px}
  .ov{padding:10px}
  .modal{padding:16px}
  .side{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:420px){.grid2{gap:12px}.btn{padding:9px 12px}}
@media (prefers-reduced-motion:reduce){.anim,.spin svg{animation:none}.side{transition:none}}
@media print{
  html,body,#root,.shell,.main{background:#fff!important;height:auto!important;overflow:visible!important}
  .shell{display:block}.side,.top,.noprint,.scrim{display:none!important}
  .page{padding:0;max-width:none}
