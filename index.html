.rp{background:#fff;color:${C.ink};font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;max-width:900px;margin:0 auto 24px;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column}
.rp *{box-sizing:border-box}
.rp-h{background:${C.navy};color:#fff;padding:12px 32px;display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:11px;line-height:1.3;border-bottom:3px solid ${C.gold}}
.rp-h b{letter-spacing:.6px}.rp-h span{color:#E6C766}
.rp-b{padding:24px 32px 28px;flex:1}
.rp-f{background:${C.navy};color:#A9BBD6;padding:9px 32px;font-size:10px;line-height:1.3;display:flex;justify-content:space-between;align-items:center;border-top:3px solid ${C.gold};gap:12px}
.rp h2{font-size:21px;color:${C.navy};text-transform:uppercase;padding-bottom:8px;border-bottom:3px solid ${C.teal};margin-bottom:14px;letter-spacing:.2px}
.rp h3{font-size:14px;color:${C.navy};margin:14px 0 6px}
.rp p{font-size:12.5px;line-height:1.62;color:#334155;margin-bottom:8px}
.rp table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:0}
.rp th{background:${C.navy};color:#fff;padding:8px 8px;text-align:left;font-weight:600;white-space:normal;border-bottom:0;font-size:11px}
.rp td{padding:7px 8px;border-bottom:1px solid #E2E8F0;white-space:normal;vertical-align:top;color:#1E293B}
.rp tr:nth-child(even) td{background:#F8FAFC}.rp tr.hl td{background:#FEF6D8}.rp td.r,.rp th.r{text-align:right}
.rp .tw{overflow-x:auto}
.rk{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 14px}
.rk>div{flex:1 1 100px;min-width:0;border:1px solid #E2E8F0;border-top:4px solid var(--c);border-radius:8px;padding:10px 12px;background:#fff}
.rk b{display:block;font-size:21px;color:${C.navy};line-height:1.15;overflow-wrap:anywhere}.rk small{display:block;font-size:10.5px;color:${C.sub};margin-top:3px}
.cb{background:${C.bg};border:1px solid #E6ECF2;border-radius:10px;padding:12px 14px}
.cb h4{font-size:12px;color:${C.navy};margin-bottom:2px}.cb .st{font-size:10.5px;color:${C.sub};margin-bottom:8px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:${C.sub};margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.co{border-left:4px solid var(--c);background:#F8FAFC;border-radius:0 8px 8px 0;padding:10px 14px;margin-top:12px}
.co h5{font-size:12px;color:var(--c);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}.co p,.co li{font-size:12px;margin-bottom:4px}.co ul{padding-left:16px}
.g2{display:grid;gap:14px;grid-template-columns:1fr 1fr}.g3{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mx>div{border-radius:8px;padding:10px 12px;border:1px solid #E2E8F0;min-height:110px}
.mx h5{font-size:11.5px;margin-bottom:6px}.mx li{font-size:11px;margin-bottom:3px;list-style:none}
.cover{background:linear-gradient(160deg,${C.navy} 0%,#0F3460 60%,#14532D 140%);color:#fff;padding:0}
.cover .in{padding:44px 40px 30px}.cover h1{font-size:34px;line-height:1.1;letter-spacing:.5px;text-transform:uppercase;margin:14px 0 6px}
.cover .tag{display:inline-block;border:1px solid ${C.gold};color:#E6C766;padding:3px 12px;border-radius:20px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.cover .kp{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0}.cover .kp>div{flex:1 1 110px;min-width:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:12px}
.cover .kp b{display:block;font-size:24px;color:#F1D27A}.cover .kp small{color:#C7D4EA;font-size:10.5px}
.cover ol{columns:2;column-gap:28px;font-size:12px;line-height:2;padding-left:0;list-style:none;color:#E4ECF7}
.warnb{background:#FFF7E0;border:1px solid #F0C36A;color:#7A4B00;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:12px;line-height:1.5}
@media(max-width:700px){.rp-h,.rp-f{flex-wrap:wrap}.rp-b{padding:16px}.rp-h,.rp-f{padding:10px 16px}.g2,.g3,.mx{grid-template-columns:1fr}.cover .in{padding:26px 18px}.cover h1{font-size:24px}.cover ol{columns:1}}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{background:${E.bg0};color:${E.text};min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
input,select{background:${E.bg3};border:1px solid ${E.border};color:${E.text};padding:10px 12px;border-radius:8px;width:100%;font-size:16px;outline:none;font-family:inherit}
input:focus,select:focus{border-color:${E.gold}}
button{cursor:pointer;font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid ${E.gold};outline-offset:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.anim{animation:fadeIn .3s ease backwards}
.spin svg{animation:spin .8s linear infinite}
.shell{display:flex;height:100vh;height:100dvh;overflow:hidden;background:${E.bg0}}
.side{width:236px;background:${E.bg1};border-right:1px solid ${E.border};padding:18px 14px;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.main{flex:1;overflow-y:auto;min-width:0}
.page{padding:28px;max-width:1280px;margin:0 auto}
.top{display:none;align-items:center;gap:12px;padding:10px 16px;background:${E.bg1};border-bottom:1px solid ${E.border};position:sticky;top:0;z-index:20}
.scrim{display:none}
.nav{display:grid;gap:4px;margin:18px 0}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:${E.muted};font-size:14px;text-align:left}
.nav button:hover{background:${E.bg3};color:${E.text}}
.nav button[aria-current=page]{background:${E.goldD};color:${E.gold};font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin-bottom:22px}
.kpi{padding:18px 20px}
.kpi-v{font-size:clamp(20px,5.2vw,26px);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.card{padding:20px 22px}
.h-title{font-size:clamp(20px,5.5vw,26px);font-weight:600}
.paper{background:#fff;color:#111;border-radius:10px;padding:28px 30px}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;margin-bottom:22px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:${E.muted};margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{text-align:left;color:${E.muted};font-weight:500;font-size:12px;padding:8px 12px;border-bottom:1px solid ${E.borderL};white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid ${E.border};white-space:nowrap}
tr.me td{background:${E.goldD}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:9px;border:1px solid ${E.border};background:${E.bg3};color:${E.text};font-size:13px;font-weight:600}
.btn:hover{border-color:${E.borderL}}
.btn.gold{background:${E.gold};color:${E.bg0};border-color:${E.gold}}
.btn.danger{color:${E.danger}}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{padding:7px 14px;border-radius:20px;border:1px solid ${E.border};background:transparent;color:${E.muted};font-size:13px}
.tabs button[aria-pressed=true]{background:${E.goldD};color:${E.gold};border-color:${E.gold}55}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;padding:16px;z-index:100;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.modal{background:${E.card};border:1px solid ${E.borderL};border-radius:14px;width:100%;max-width:600px;margin:auto;padding:22px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;margin-bottom:12px}
.fg label{font-size:12px;color:${E.muted};display:block;margin-bottom:5px}
.legend{align-items:center}
.grid-t input,.grid-t select{padding:6px 8px;font-size:14px;min-width:90px;border-radius:6px}
.grid-t td{padding:5px 6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:${E.card2};border:1px solid ${E.borderL};padding:10px 16px;border-radius:10px;z-index:80;font-size:13px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.note{font-size:12px;color:${E.muted};line-height:1.6}
@media (max-width:820px){
  .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-105%);transition:transform .2s;z-index:40;width:260px}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30}
  .top{display:flex}
  .page{padding:14px 14px 28px}
  .card{padding:16px}
  .kpi{padding:14px}
  .paper{padding:18px 16px}
  .ov{padding:10px}
  .modal{padding:16px}
  .side{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:420px){.grid2{gap:12px}.btn{padding:9px 12px}}
@media (prefers-reduced-motion:reduce){.anim,.spin svg{animation:none}.side{transition:none}}
@media print{
  html,body,#root,.shell,.main{background:#fff!important;height:auto!important;overflow:visible!important}
  .shell{display:block}.side,.top,.noprint,.scrim{display:none!important}
