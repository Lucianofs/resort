  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{background:${x.bg0};color:${x.text};min-height:100%;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  input{background:${x.bg3};border:1px solid ${x.border};color:${x.text};padding:10px 12px;
    border-radius:8px;width:100%;font-size:16px;outline:none}
  input:focus{border-color:${x.gold}}
  button{cursor:pointer;font-family:inherit}
  button:focus-visible{outline:2px solid ${x.gold};outline-offset:2px}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .anim{animation:fadeIn .3s ease both}
  .shell{display:flex;height:100vh;height:100dvh;overflow:hidden;background:${x.bg0}}
  .side{width:220px;background:${x.bg1};border-right:1px solid ${x.border};padding:20px;

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
  .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;margin-bottom:24px}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:${x.muted};margin-top:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  @media (max-width:720px){
    .shell{flex-direction:column}
    .side{width:100%;flex-direction:row;align-items:center;justify-content:space-between;
      border-right:0;border-bottom:1px solid ${x.border};padding:12px 16px}
    .main{padding:16px}
