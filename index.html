.tw{overflow-x:auto}

tr.me td{background:${w.goldD}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:9px;border:1px solid ${w.border};background:${w.bg3};color:${w.text};font-size:13px;font-weight:600}
.btn:hover{border-color:${w.borderL}}
.btn.gold{background:${w.gold};color:${w.bg0};border-color:${w.gold}}
.btn.danger{color:${w.danger}}

.tabs button{padding:7px 14px;border-radius:20px;border:1px solid ${w.border};background:transparent;color:${w.muted};font-size:13px}
.tabs button[aria-pressed=true]{background:${w.goldD};color:${w.gold};border-color:${w.gold}55}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal{background:${w.card};border:1px solid ${w.borderL};border-radius:14px;width:100%;max-width:600px;max-height:92vh;overflow:auto;padding:22px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;margin-bottom:12px}

.legend{align-items:center}
.grid-t input,.grid-t select{padding:6px 8px;font-size:14px;min-width:90px;border-radius:6px}
.grid-t td{padding:5px 6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:${w.card2};border:1px solid ${w.borderL};padding:10px 16px;border-radius:10px;z-index:80;font-size:13px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.note{font-size:12px;color:${w.muted};line-height:1.6}
@media (max-width:820px){

  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30}
  .top{display:flex}
  .page{padding:16px}
}
